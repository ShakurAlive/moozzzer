exclude: (pnpm-lock\.yaml|uv\.lock)$
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # keep in sync with ruff in backend/uv.lock
    hooks:
      - id: ruff
        name: ruff lint
        files: ^backend/
        args: [--fix]
      - id: ruff-format
        name: ruff format
        files: ^backend/

  # Uses apps/web's own prettier + plugins (same versions as CI); needs `pnpm install` in apps/web.
  - repo: local
    hooks:
      - id: prettier
        name: prettier (apps/web)
        language: system
        entry: npx --yes pnpm@10 -C apps/web exec prettier --write --ignore-unknown .
        files: ^apps/web/
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
