name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.image }}
    needs: ci
    # Native arm64 runner by default; set repo variable USE_QEMU=true to emulate on x64 instead.
    runs-on: ${{ vars.USE_QEMU == 'true' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            context: backend
            target: api
          - image: worker
            context: backend
            target: worker
          - image: web
            context: apps/web
            target: web
    steps:
      - uses: actions/checkout@v5

      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/moozzzer-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - if: vars.USE_QEMU == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only for OCI labels (incl. image.source, which links the package to this repo).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.repo }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
            ${{ steps.name.outputs.repo }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy:
    needs: build
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy-server.yml
    with:
      tag: ${{ github.sha }}
    secrets: inherit
